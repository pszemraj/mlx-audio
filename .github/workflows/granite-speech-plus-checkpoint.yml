name: Granite Speech Plus checkpoint parity

on:
  workflow_dispatch:

jobs:
  pinned-checkpoint:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install exact parity stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev,granite-parity]"

      - name: Run pinned 2B checkpoint smoke
        env:
          MLX_AUDIO_RUN_GRANITE_CHECKPOINT_PARITY: '1'
        run: pytest -s tests/model_parity/test_granite_speech_plus_checkpoint.py
